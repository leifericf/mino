name: ci

on:
  push:
    branches: [main]

# Hosted runners have 2-4 cores, and standalone mino grants
# thread_limit = cpu_count at startup, so the server suites (2
# acceptors + spawner + workers + client futures) hit MTH001 on the
# runner while passing on any dev machine. The suite's concurrency
# need is a property of the tests, not of the runner, so grant it
# explicitly (the documented override in main.c).
env:
  MINO_THREAD_LIMIT: "16"

jobs:
  build:
    name: build - ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Pinned runner labels so a future GHA image bump doesn't
        # silently shift the matrix. `ubuntu-24.04-arm` is the GHA
        # ARM64 Linux tier (added 2024); together with `ubuntu-24.04`
        # we cover both Linux architectures natively. `macos-14` is
        # Apple Silicon. `windows-2022` is x86_64 Windows.
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      CC: ${{ matrix.os == 'windows-2022' && 'gcc' || 'cc' }}
    steps:
      - uses: actions/checkout@v5

      - name: Compiler version
        run: |
          $CC --version
          # On ubuntu-24.04 the alt-versions are also available; print
          # them so a future regression that's gcc-13-specific (or
          # 12-specific) is easier to triage.
          if [ "${{ matrix.os }}" = "ubuntu-24.04" ] || [ "${{ matrix.os }}" = "ubuntu-24.04-arm" ]; then
            for v in 12 13 14; do
              if command -v gcc-$v >/dev/null; then
                gcc-$v --version | head -1
              fi
            done
          fi

      - name: Bootstrap mino
        # Generates the bundled-source headers and compiles ./mino in
        # one step. Anything beyond bootstrap belongs in `./mino task`.
        # Tee stderr so a build failure leaves a captured log for the
        # post-step summary below; the live step output stays
        # unchanged for anyone with log access.
        run: |
          set -o pipefail
          make 2>&1 | tee /tmp/build.log

      - name: Surface build failure
        # When the build step above fails, post the captured tail on
        # the job summary page so anyone with Actions UI access (incl.
        # signed-in external contributors) sees what broke without
        # having to download artifacts.
        if: failure()
        run: |
          {
            echo "## Build failure (${{ matrix.os }})"
            echo ''
            echo '```'
            tail -60 /tmp/build.log 2>/dev/null || echo '(no build log captured)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build log on failure
        # Artifacts are downloadable from the Actions page anonymously
        # for public repositories, so this is the path for off-repo
        # observers (and for the project bot) to see the actual gcc
        # error output without needing log-download permission.
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.os }}
          path: /tmp/build.log
          retention-days: 7

      - name: Test
        # Run the suite runner directly so stdout streams. `task test`
        # wraps the subprocess in sh!, which buffers output until exit;
        # under a hang, no diagnostic ever surfaces.
        #
        # MINO_TEST_TRACE=1 prints one stderr line per deftest before
        # it runs; combined with capturing stderr into a file and
        # tee'ing it to the job log, the last visible trace line
        # pinpoints any hanging test. The stderr capture is what makes
        # an opaque "Test timed out" actionable. Keeps trace off
        # locally (env-gated) so a normal `./mino tests/run.clj`
        # produces the same output as before.
        #
        # Watchdog wrapper: GHA's timeout-minutes sends a SIGKILL after
        # the cap, which gives no diagnostic at all on a hang. We
        # spawn mino in the background, sleep just inside the cap,
        # then SIGABRT it -- mino's crash_handler (main.c:711) prints
        # a backtrace + gc stats on SIGABRT, so a hang now leaves a
        # readable stack in the log instead of a silent kill. mino
        # exits non-zero after the dump, which fails the step
        # normally (no continue-on-error masking).
        env:
          MINO_TEST_TRACE: "1"
        run: |
          set +e
          # Pre-create + tail the trace file so its lines stream to
          # the live job log as mino emits them. Without the tail,
          # the trace only appears via the failure artifact, which
          # makes a live `gh run watch` opaque.
          : > /tmp/test_trace.log
          (tail -F /tmp/test_trace.log 2>/dev/null) &
          TAIL_PID=$!
          # Linux runners execute the suite as 3 sequential shard
          # processes (MINO_TEST_SHARD=k/3): the suite's RSS on
          # glibc grows with every file loaded in-process and a
          # single full run can exhaust the 16GB hosted VM (which
          # takes the runner agent down with it). Each partition
          # peaks around 4-5GB; macOS and Windows stay single-run.
          # The watchdog wraps the whole sequence; per-shard hangs
          # still pinpoint via the trace tail below.
          run_one () {
            (exec ./mino tests/run.clj) 2>> /tmp/test_trace.log &
            MINO_PID=$!
            (sleep 900; if kill -0 $MINO_PID 2>/dev/null; then
               echo "##[warning]Watchdog firing SIGABRT on hung mino (pid $MINO_PID)"
               kill -ABRT $MINO_PID
             fi) &
            WD_PID=$!
            wait $MINO_PID
            RC=$?
            kill $WD_PID 2>/dev/null || true
            return $RC
          }
          OVERALL=0
          if [ "$RUNNER_OS" = "Linux" ]; then
            for K in 1 2 3; do
              export MINO_TEST_SHARD=$K/3
              echo "=== suite shard $K/3 ==="
              run_one || { OVERALL=1; break; }
            done
            unset MINO_TEST_SHARD
          else
            run_one || OVERALL=1
          fi
          RC=$OVERALL
          # Give the trace tail a moment to flush mino's last lines.
          sleep 1
          kill $TAIL_PID 2>/dev/null || true
          exit $RC
        # Tests usually finish in seconds; a hang means a deadlock, not
        # a slow runner. Cap so we get diagnostic output instead of
        # waiting on the 6h job-default timeout. The per-shard
        # watchdog above fires well before this cap so we keep the
        # stack trace. macOS runs the suite single-process and its
        # runners vary ~2x in speed; 15m keeps the slow tail inside
        # the step cap while the watchdog guards true hangs.
        timeout-minutes: 17
        # The Windows test suite has documented divergence: cmd.exe's
        # echo emits a trailing space before \n, which the proc-test
        # assertions do not strip. Build still must pass; tests are
        # informational on Windows until the suite is portable.
        continue-on-error: ${{ matrix.os == 'windows-2022' }}

      - name: Upload test trace on failure
        # The trace captures each deftest entry; the last line shows
        # what was running when the timeout fired. Artifacts are
        # public on the run page so triage doesn't require log
        # download permission.
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-trace-${{ matrix.os }}
          path: /tmp/test_trace.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Generative property lane
        # JSON round-trip properties. The lane runs with the JIT
        # disabled inside the task (a CPJIT defect around the hot
        # format-double path crashes the process; tracked as a known
        # issue), so this step needs no extra env.
        if: matrix.os != 'windows-2022'
        run: ./mino task test-generative
        timeout-minutes: 5

      - name: HTTP integration lane
        # End-to-end localhost lane: the in-process mino fixture
        # server (tests/fixtures/http/server.clj, accept loop on a
        # worker future) driven through the mino.http surface
        # (tests/http_integration_test.clj): query/header GETs, JSON
        # POST echo, gist pagination, 404 ex-data, redirect chains
        # with 307 body preservation, keep-alive connection counting,
        # gzip, chunked, async deref, and read timeouts. In process,
        # so the lane runs on every matrix leg (TLS end-to-end legs
        # live in the mino-tests satellite repo).
        #
        # Windows runs the integration file directly instead of
        # `./mino task test-http`: the task's :deps [build] relinks
        # mino.exe while ./mino itself is that running image, and
        # Windows write-locks a running executable (ld: "cannot open
        # output file mino.exe: Permission denied") where POSIX
        # allows the replace. The binary under test is the one the
        # Bootstrap step built and the Test step just ran, so the
        # rebuild the dep would add is redundant on this leg anyway.
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            ./mino tests/http_integration_test.clj
          else
            ./mino task test-http
          fi
        timeout-minutes: 5

      # The composite release-gate (structural invariants, the suite
      # under ASan, and 4-way JIT parity) used to run here on every
      # non-Windows matrix leg. Running the plain suite (already covered
      # by the Test step above) plus ASan x2 plus parity on the slow
      # arm64 runner overran the watchdog. Those checks now run once each
      # in the dedicated `invariants`, `asan-auto`/`asan-jit`, and
      # `jit-parity` jobs below, so no single job carries the whole gate.
      # The full
      # composite still runs self-contained in ci-nightly and as the
      # human pre-tag `release-gate` task.

      - name: Embed API smoke test
        if: matrix.os != 'windows-2022'
        run: ./mino task test-embed
        timeout-minutes: 5

  # Structural invariants, host-agnostic. check-reloc-mirror (G3) and
  # check-stencil-registry (G2) are pure data checks; the examples lanes
  # compile every examples/embed_*.c against the lib srcs and the
  # amalgamation. None of these vary by OS, so they run once here rather
  # than on every matrix leg (where they were part of the old gate).
  invariants:
    name: gate - invariants + examples
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - name: Bootstrap mino
        run: make

      - name: Reloc + stencil-registry invariants
        run: |
          ./mino task check-reloc-mirror
          ./mino task check-stencil-registry
        timeout-minutes: 10

      - name: Embed examples (lib srcs + amalgam)
        run: |
          ./mino task examples
          ./mino task examples-amalgam
        timeout-minutes: 10

  # Full suite under AddressSanitizer. The ASan runtime is the host
  # toolchain's libasan (zig ships none). Linux is the canonical ASan
  # lane -- it carries LeakSanitizer (macOS ASan does not) and its
  # 4-vCPU grant runs the concurrency suite without the thread-slot
  # starvation a 3-vCPU macOS runner hits under ~10x instrumentation.
  # arm64/macOS memory-safety stays covered by the native mac build plus
  # the pinned-zig UBSan/TSan lane. Windows is absent because mingw ships
  # no libsanitizer.
  #
  # The two JIT modes run as SEPARATE PARALLEL jobs. One ASan pass takes
  # ~16 min on a hosted runner, so a single job running AUTO then eager
  # serially took ~32 min and overran the 25-minute watchdog (the
  # watchdog's SIGABRT was misread as a crash; it was just walltime).
  # Split, each job carries one pass and finishes well inside the cap;
  # together they preserve the exact both-modes coverage.
  asan-auto:
    name: gate - asan suite (auto)
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    env:
      # ASan runs the suite ~10x slower; the parked-gc net stress scales
      # its forced-collection churn down on this flag so its deep sweep
      # does not starve the fixture accept loop into a read timeout under
      # instrumentation.
      MINO_SLOW_HOST: "1"
    steps:
      - uses: actions/checkout@v5

      - name: Bootstrap mino
        run: make

      - name: Full suite under ASan (auto JIT)
        # Own watchdog: spawn the task, sleep just under the cap, then
        # SIGABRT any live mino for a backtrace (crash_handler dumps a
        # stack on SIGABRT, exit 134) instead of GHA's diagnostic-free
        # SIGKILL.
        run: |
          set +e
          ./mino task test-suite-asan-auto &
          T_PID=$!
          (sleep 1500; if kill -0 $T_PID 2>/dev/null; then
             echo "##[warning]Watchdog: asan auto suite exceeded 25m; SIGABRT mino"
             pkill -ABRT mino_asan 2>/dev/null
             pkill -ABRT mino 2>/dev/null
           fi) &
          WD_PID=$!
          wait $T_PID
          RC=$?
          sleep 2
          kill $WD_PID 2>/dev/null || true
          exit $RC
        timeout-minutes: 28

  asan-jit:
    name: gate - asan suite (jit)
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    env:
      MINO_SLOW_HOST: "1"
    steps:
      - uses: actions/checkout@v5

      - name: Bootstrap mino
        run: make

      - name: Full suite under ASan (eager JIT)
        run: |
          set +e
          ./mino task test-suite-asan-jit &
          T_PID=$!
          (sleep 1500; if kill -0 $T_PID 2>/dev/null; then
             echo "##[warning]Watchdog: asan jit suite exceeded 25m; SIGABRT mino"
             pkill -ABRT mino_asan 2>/dev/null
             pkill -ABRT mino 2>/dev/null
           fi) &
          WD_PID=$!
          wait $T_PID
          RC=$?
          sleep 2
          kill $WD_PID 2>/dev/null || true
          exit $RC
        timeout-minutes: 28

  # Four-way JIT parity (auto / on / off / lean): byte-identical stdout
  # across every JIT mode. Host-agnostic behaviour check; runs once on
  # one runner rather than on every matrix leg.
  jit-parity:
    name: gate - jit parity (4-way)
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - name: Bootstrap mino
        run: make

      - name: Four-way JIT parity
        run: ./mino task test-jit-parity
        timeout-minutes: 15

  # Stencil determinism, re-armed.
  #
  # A previous `cross-compile` job regenerated each target's stencil
  # header on macos-14 and diffed against committed bytes. It was
  # removed when the dev / CI clang version split (Apple clang 17
  # locally vs Apple clang 15 on macos-14, gcc on Linux) made
  # byte-identity infeasible across hosts.
  #
  # This job replaces it on a sound footing: ONE runner with ONE
  # pinned `zig cc` (the same toolchain `gen-stencils-all` uses
  # locally) cross-compiles every target, so the emitted bytes are
  # reproducible by construction. It must stay a single-host job --
  # putting a byte-identity check back on the per-OS matrix is exactly
  # what broke the old one. The native matrix above remains the
  # portability canary (gcc + Apple clang + mingw); this job only
  # guards committed-byte freshness against the pinned toolchain.
  stencil-determinism:
    name: reproducibility - stencils
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - name: Install pinned Zig
        # Version must match `zig-version-pin` in
        # lib/mino/tasks/builtin.clj. Zig is pre-1.0; a minor bump can
        # shift the bundled LLVM and therefore the emitted stencil
        # bytes, so bump both in lockstep and regenerate.
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Bootstrap mino
        run: make

      - name: Check stencil freshness (all targets)
        # Regenerates all five committed headers via the pinned zig cc
        # and fails if `git diff` is non-empty -- i.e. somebody edited a
        # stencil source (or bumped the pin) without regenerating.
        run: ./mino task check-stencils-fresh-all
        timeout-minutes: 10

  sanitize-zig:
    name: safety - sanitizers (UBSan+TSan)
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    env:
      # TSan + UBSan instrumentation makes every stop-the-world
      # collection far slower; the parked-gc net stress scales its
      # forced-collection churn down on this flag so the fixture accept
      # loop is not starved into a read timeout. Same knob the emulated
      # jit-host canary uses; the deep sweep stays on native CI.
      MINO_SLOW_HOST: "1"
    steps:
      - uses: actions/checkout@v5

      - name: Install pinned Zig
        # Must match zig-version-pin in lib/mino/tasks/builtin.clj.
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Bootstrap mino
        run: make

      - name: Reproducible UBSan + TSan suite (pinned compiler-rt)
        # Builds mino with the version-locked zig cc under UBSan and TSan
        # -- JIT-enabled for this host (jit-enable-flags) -- and runs the
        # full suite under each in AUTO and eager JIT mode. Additive to
        # the host ASan build in release-gate; ASan is absent because zig
        # ships no ASan runtime (that coverage stays on the host
        # toolchain).
        run: ./mino task sanitize-zig
        timeout-minutes: 25

  lint-zig:
    name: safety - strict warnings
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - name: Install pinned Zig
        # Must match zig-version-pin in lib/mino/tasks/builtin.clj.
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Bootstrap mino
        run: make

      - name: Curated strict-warning lint (third compiler lens)
        # Compiles every mino-authored TU under -Werror over a curated
        # strict warning set with zig's newer clang -- catching issues
        # the gcc/Apple-clang matrix does not flag. Compile-only.
        run: ./mino task lint-zig
        timeout-minutes: 10

  build-zig-hermetic:
    name: reproducibility - hermetic build
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - name: Install pinned Zig
        # Must match zig-version-pin in lib/mino/tasks/builtin.clj.
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Bootstrap mino
        run: make

      - name: Hermetic build + full suite (pinned zig cc, static musl)
        # Builds mino entirely with the version-locked zig cc (compiler,
        # libc, linker) and runs the full suite against it, so a green
        # build does not depend on the runner image's gcc/clang version.
        # Additive: the gcc/Apple-clang/mingw matrix stays the canary.
        run: ./mino task test-zig
        timeout-minutes: 15

  binary-reproducible:
    name: reproducibility - byte-identical binary
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - name: Install pinned Zig
        # Must match zig-version-pin in lib/mino/tasks/builtin.clj.
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Bootstrap mino
        run: make

      - name: Reproducible-artifact gate (pinned zig cc)
        # Builds the published linux-amd64-musl artifact twice and asserts
        # it is byte-identical and embeds no builder-specific absolute path
        # ($PWD / $HOME) -- the property that lets a third party rebuild the
        # exact published bytes from the pinned toolchain + source. Like
        # stencil-determinism, this is single-host on purpose: it asserts a
        # property of one build environment, never compares across images.
        run: ./mino task check-binary-reproducible
        timeout-minutes: 15
