name: ci-probe

# TEMPORARY diagnostic (2026-08-21): discriminate hosted-runner
# degradation from suite content during the ubuntu kill wave, and
# measure the suite's true peak RSS on a real 16GB runner.
# Delete after diagnosis.
on:
  workflow_dispatch:
  push:
    branches: [probe-ubuntu]

jobs:
  sleep-probe:
    strategy:
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Six-minute sleep
        run: |
          for i in $(seq 1 12); do
            echo "probe minute $i ($(date -u +%H:%M:%S))"
            sleep 30
          done
      - name: Churn probe
        run: |
          for i in 1 2 3 4; do
            python3 -c "xs=bytearray(1_500_000_000); xs[::4096]=b'x'*len(xs[::4096]); print('churn', $i, 'alive', __import__('time').strftime('%H:%M:%S'))"
          done

  suite-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - name: Build mino
        run: make
      - name: Full suite with RSS monitor
        env:
          MINO_TEST_TRACE: "1"
        run: |
          set +e
          ( while true; do
              ps -o rss= -C mino 2>/dev/null | head -1
              sleep 1
            done ) > /tmp/rss.log &
          MON=$!
          ./mino tests/run.clj > /tmp/suite.log 2>&1
          RC=$?
          kill $MON 2>/dev/null
          echo "suite exit=$RC"
          tail -2 /tmp/suite.log
          echo "--- peak RSS (KB):"; sort -n /tmp/rss.log | tail -1
          echo "--- final traces:"; tail -3 /tmp/suite.log.mino_trace 2>/dev/null || true
          exit 0
