[project]
name = "sample-project"
version = "0.9.2"
description = """
A sample project exercising every TOML shape a real pyproject uses: \
tables, dotted keys, inline tables, arrays of tables, multiline \
strings, dates, and radix ints."""
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT", spdx = "MIT" }
authors = [
    { name = "Jane Doe", email = "jane@example.com" },
    { name = "Alan Smith", email = "alan@example.com" },
]
dependencies = [
    "click>=8.1",
    "httpx>=0.27",
    "rich>=13.7",
]
dynamic = ["optional-dependencies"]

[project.scripts]
sample = "sample_project.cli:main"
sample-worker = "sample_project.worker:main"

[project.entry-points."package.metadata"]
author = "Jane Doe"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.sample]
released = 2024-06-01
timeout = 30.5
retries = 3
verbose = false
mask = 0xDEAD_beef

[tool.sample.run]
args = ["--strict", "--fast"]

[tool.sample.cache."cold.start"]
enabled = false

[dependency-groups]
dev = [
    { name = "pytest", version = "8.0" },
    { name = "ruff" },
]

[[tool.sample.mirrors]]
url = "https://eu.example.com/mirror"
priority = 1

[[tool.sample.mirrors]]
url = "https://us.example.com/mirror"
priority = 2
